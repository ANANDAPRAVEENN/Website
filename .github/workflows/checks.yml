name: Website checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check assets/site.js
          node --check assets/world-map.js
          node --check api/enquiry.js
      - name: Validate enquiry behaviour without sending email
        run: node --test tests/enquiry.test.js
